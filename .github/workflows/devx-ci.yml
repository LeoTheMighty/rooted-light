# devx CI — Astro static site (rooted-light-website)
# Generated by /devx-init; stack gates wired by rlw101. Re-running
# /devx-init upgrades the workflow when the stack changes.
# >>> devx
name: devx-ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: devx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "[devx] no linter configured yet for the Astro stack — honest no-op (rlw101)"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build is the verifiable gate for the static site until a test
      # framework lands (schema validation + full route render).
      - run: npm run build

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "[devx] no coverage runner yet — no-op until a test framework lands"

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:full
      # Workstream evals are RED by design until their phase lands
      # (plan cdea58). continue-on-error reports each eval's status in
      # the log/annotations without failing the run — the lint/test
      # contract above stays unmasked and authoritative.
      - name: run evals (red expected until their phase lands)
        continue-on-error: true
        run: npm run evals
# <<< devx
